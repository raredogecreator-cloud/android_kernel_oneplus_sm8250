name: Build Kernel - OnePlus 8 Pro (SukiSU Ultra + SUSFS)

on:
  workflow_dispatch:
  push:
    branches:
      - oneplus/SM8250_R_11.0

env:
  ARCH: arm64
  SUBARCH: arm64
  # SM8250 = Snapdragon 865 = "kona" (not "lahaina" which is SM8350)
  KERNEL_DEFCONFIG: vendor/kona-perf_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout workflow files
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            libelf-dev libssl-dev lz4 python3 rsync zip zlib1g-dev

          # LLVM=1 expects unversioned tool names; the apt packages only
          # provide -14 suffixed binaries. Symlink them so clang, ld.lld,
          # llvm-ar, etc. resolve to the installed LLVM 14 toolchain.
          for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy \
                      llvm-objdump llvm-strip llvm-readelf llvm-ranlib; do
            if [ -x "/usr/bin/${tool}-14" ]; then
              sudo ln -sf "/usr/bin/${tool}-14" "/usr/bin/${tool}"
            fi
          done
          clang --version

      - name: Clone kernel source
        run: |
          git clone --depth=1 --branch oneplus/SM8250_R_11.0 \
            https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git \
            kernel-source
          echo "drivers/ exists: $(ls -d kernel-source/drivers/ 2>/dev/null || echo NO)"

      - name: Debug - List root directory
        run: |
          echo "Branch: $(git -C kernel-source branch --show-current)"
          echo "Contents:"
          ls -la kernel-source/

      - name: Integrate SukiSU Ultra
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          echo "Current directory: $(pwd)"
          echo "drivers/ exists: $(ls -d drivers/ 2>/dev/null || echo NO)"
          # susfs-main is the correct branch for non-GKI SUSFS support per
          # SukiSU docs; it ships SukiSU's own KSU-side SUSFS integration, so
          # the separate 10_enable_susfs_for_ksu.patch is not needed.
          # (susfs-dev does not exist and silently fell back to the default.)
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main

      - name: Debug - KernelSU branches available
        run: |
          echo "=== Available SukiSU-Ultra branches ==="
          git -C kernel-source/KernelSU branch -r
          git -C kernel-source/KernelSU tag | tail -20
          echo "=== git branch -a in kernel-source/KernelSU ==="
          git -C kernel-source/KernelSU branch -a || echo "no KernelSU git dir"
          echo "=== current KernelSU HEAD ==="
          git -C kernel-source/KernelSU log --oneline -1 2>/dev/null || true
          echo "=== KernelSU remotes ==="
          git -C kernel-source/KernelSU remote -v 2>/dev/null || true
          echo "=== KernelSU directory listing ==="
          ls -la kernel-source/KernelSU/ 2>/dev/null || echo "no KernelSU dir"
          echo "=== setup.sh branch handling ==="
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | grep -nE 'branch|susfs|case|esac|\-b ' || true

      - name: Verify susfs actually integrated
        run: |
          if ! grep -rq "susfs" kernel-source/KernelSU/kernel/ 2>/dev/null; then
            echo "ERROR: SukiSU was set up WITHOUT susfs — wrong branch name. See branch list above."
            exit 1
          fi
          echo "OK: susfs present in KernelSU"

      - name: Clone and apply SUSFS patches
        run: |
          # Repo lives on GitLab, branch kernel-4.19
          git clone --depth=1 -b kernel-4.19 \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu

          # Copy SUSFS source files (paths per upstream README)
          cp susfs4ksu/kernel_patches/fs/susfs.c kernel-source/fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h kernel-source/include/linux/

          # Apply main kernel patch for 4.19.
          # --fuzz=3 --ignore-whitespace handles context mismatches in the
          # vendor-modified OnePlus tree vs stock 4.19.
          patch -p1 --fuzz=3 --ignore-whitespace -d kernel-source \
            < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true

          # Manual injection for include/linux/sched.h KABI fix
          sed -i '/randomized_struct_fields_end/i #if defined(CONFIG_KSU_SUSFS)\n\tu64 susfs_task_state;\n\tu64 susfs_last_fake_mnt_id;\n#endif' kernel-source/include/linux/sched.h
          rm -f kernel-source/include/linux/sched.h.rej

          # Manual injection for include/linux/mount.h KABI fix
          sed -i '/void \*data;/i #if defined(CONFIG_KSU_SUSFS)\n\tu64 susfs_mnt_id_backup;\n#endif' kernel-source/include/linux/mount.h
          rm -f kernel-source/include/linux/mount.h.rej

          # Diagnostic: print any SELinux rejection details
          echo "=== DUMPING SELINUX REJECTIONS ==="
          cd kernel-source && cat kernel/selinux/*.rej || true && cd ..

          # Strict check: fail if any .rej files remain
          if find kernel-source -name "*.rej" | grep -q .; then
            echo "ERROR: Unresolved patch rejections remain!"
            find kernel-source -name "*.rej"
            exit 1
          fi

          # NOTE: 10_enable_susfs_for_ksu.patch is intentionally NOT applied.
          # SukiSU Ultra's susfs-dev branch already includes the KSU-side
          # SUSFS code (kernel/ksu.c, allowlist.c, core_hook.c, etc.), so
          # applying that patch would fail with "can't find file to patch".

      - name: Enable required kernel configurations
        run: |
          DEFCONFIG="kernel-source/arch/arm64/configs/${KERNEL_DEFCONFIG}"

          set_config() {
            local cfg="$1" val="$2"
            if grep -qE "^# ${cfg} is not set" "$DEFCONFIG"; then
              sed -i "s/^# ${cfg} is not set/${cfg}=${val}/" "$DEFCONFIG"
            elif grep -qE "^${cfg}=" "$DEFCONFIG"; then
              sed -i "s/^${cfg}=.*/${cfg}=${val}/" "$DEFCONFIG"
            else
              echo "${cfg}=${val}" >> "$DEFCONFIG"
            fi
          }

          # Non-GKI KernelSU/SukiSU requires KALLSYMS for symbol lookup
          set_config CONFIG_KALLSYMS y
          set_config CONFIG_KALLSYMS_ALL y

          # kprobe-based hook method
          set_config CONFIG_KPROBES y
          set_config CONFIG_KPROBE_EVENTS y

          echo "Relevant config entries after patching:"
          grep -E "KALLSYMS|KPROBES|SUSFS" "$DEFCONFIG" || true

      - name: Pre-build toolchain fixes
        run: |
          # 1. GCC/clang default to -fno-common, which trips the DTC lexer's
          #    tentative "YYLTYPE yylloc;" definition (duplicate of the one in
          #    the bison-generated parser). Mark it extern. The real source in
          #    this tree is the flex input dtc-lexer.l (no .lex.c_shipped),
          #    which flex compiles into dtc-lexer.lex.c at build time.
          DTC_LEXER="kernel-source/scripts/dtc/dtc-lexer.l"
          echo "Before:"; grep -n 'YYLTYPE yylloc;' "$DTC_LEXER" || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' "$DTC_LEXER"
          echo "After:"; grep -n 'yylloc;' "$DTC_LEXER" || true

          # 2. scripts/gcc-wrapper.py is Python 2 end to end (print syntax AND
          #    bytes/str subprocess handling -> "a bytes-like object is
          #    required, not 'str'"). We do not need its warning-policing for
          #    this build, so replace it wholesale with a minimal Python 3
          #    passthrough that runs the real compiler and propagates its exit
          #    code. Heredoc body is indented to the YAML block level; YAML
          #    strips that indentation so the file gets clean column-0 content.
          GCC_WRAPPER="kernel-source/scripts/gcc-wrapper.py"
          cat > "$GCC_WRAPPER" <<'PYEOF'
          #!/usr/bin/env python3
          import sys, subprocess
          sys.exit(subprocess.call(sys.argv[1:]))
          PYEOF
          chmod +x "$GCC_WRAPPER"
          echo "New gcc-wrapper.py:"
          cat "$GCC_WRAPPER"

      - name: Generate kernel .config
        working-directory: ${{ github.workspace }}/kernel-source
        run: |
          make \
            LLVM=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            ARCH=arm64 \
            O=out \
            ${KERNEL_DEFCONFIG}

      - name: Build kernel
        working-directory: ${{ github.workspace }}/kernel-source
        run: |
          export KBUILD_BUILD_USER="CI"
          export KBUILD_BUILD_HOST="GitHub-Actions"

          make -j$(nproc --all) \
            LLVM=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            ARCH=arm64 \
            O=out \
            2>&1 | tee out/build.log

          echo "--- Boot artifacts ---"
          ls -lh out/arch/arm64/boot/ || echo "ERROR: No boot directory found"

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          # Write device-specific anykernel.sh for OnePlus 8 Pro (instantnoodlep)
          # Using printf to avoid YAML block-scalar indentation conflicts with heredocs.
          {
            printf '%s\n' '# AnyKernel3 AnyKernel Script'
            printf '%s\n' '# osm0sis @ xda-developers'
            printf '\n'
            printf '%s\n' '## AnyKernel setup'
            printf "properties() { '\n"
            printf '%s\n' 'kernel.string=SukiSU Ultra + SUSFS Kernel'
            printf '%s\n' 'do.devicecheck=1'
            printf '%s\n' 'do.modules=0'
            printf '%s\n' 'do.systemless=1'
            printf '%s\n' 'do.cleanup=1'
            printf '%s\n' 'do.cleanuponabort=0'
            printf '%s\n' 'device.name1=instantnoodlep'
            printf '%s\n' 'device.name2=OnePlus8Pro'
            printf '%s\n' 'device.name3='
            printf '%s\n' 'device.name4='
            printf '%s\n' 'device.name5='
            printf '%s\n' 'supported.versions=11'
            printf "'; }\n"
            printf '\n'
            printf '%s\n' '## AnyKernel methods (important to source before functions)'
            printf '%s\n' '. tools/ak3-core.sh'
            printf '\n'
            printf '%s\n' '## AnyKernel install'
            printf '%s\n' 'dump_boot'
            printf '%s\n' 'write_boot'
          } > AnyKernel3/anykernel.sh

          BOOT_DIR="kernel-source/out/arch/arm64/boot"

          # Copy kernel image - prefer combined Image.gz-dtb, then split files
          if [ -f "${BOOT_DIR}/Image.gz-dtb" ]; then
            cp "${BOOT_DIR}/Image.gz-dtb" AnyKernel3/
            echo "Using Image.gz-dtb"
          elif [ -f "${BOOT_DIR}/Image.gz" ]; then
            cp "${BOOT_DIR}/Image.gz" AnyKernel3/
            echo "Using Image.gz"
          elif [ -f "${BOOT_DIR}/Image" ]; then
            cp "${BOOT_DIR}/Image" AnyKernel3/
            echo "Using Image"
          else
            echo "ERROR: No kernel image found in ${BOOT_DIR}" && exit 1
          fi

          # Copy DTBO image for A/B devices if present
          [ -f "${BOOT_DIR}/dtbo.img" ] && cp "${BOOT_DIR}/dtbo.img" AnyKernel3/ || true

          BUILD_DATE=$(date +%Y%m%d-%H%M%S)
          ZIP_NAME="SukiSU-Ultra_SUSFS_OnePlus8Pro_${BUILD_DATE}.zip"

          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" . -x '*.git*' README.md '*placeholder'
          cd ..

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          ls -lh "${ZIP_NAME}"

      - name: Upload AnyKernel3 flashable zip
        uses: actions/upload-artifact@v4.6.0
        with:
          name: SukiSU-Ultra-SUSFS-OnePlus8Pro
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: build-log
          path: kernel-source/out/build.log
          if-no-files-found: ignore
